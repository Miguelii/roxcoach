name: PR Checks

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main
        types: [opened, synchronize, reopened, ready_for_review]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
    contents: read

# Placeholders only: the checks never reach Supabase or Gemini. They satisfy the env validation
# in src/env (build) and the test setup.
env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    NEXT_TELEMETRY_DISABLED: 1
    NEXT_SUPABASE_URL: http://localhost:54321
    NEXT_SUPABASE_PUBLISHABLE_KEY: test-publishable-key
    NEXT_SUPABASE_SERVICE_ROLE_KEY: test-service-key
    NEXT_PUBLIC_WEBSITE_URL: http://localhost:3000

# Scripts run with `node --run` instead of `pnpm run`: no package manager start-up per step.
# The four jobs run in parallel, so the wall time is the slowest one (the build).
jobs:
    lint:
        name: Format, Lint & Knip
        if: github.event.pull_request.draft != true
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v7
            - uses: ./.github/actions/setup
            - run: node --run fmt -- --check
            - run: node --run lint
            - run: node --run knip

    typecheck:
        name: Typecheck
        if: github.event.pull_request.draft != true
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v7
            - uses: ./.github/actions/setup
            # tsconfig has `incremental: true`: restoring the last build info lets tsc re-check
            # only what changed. A new key per commit, restored from the latest one.
            - uses: actions/cache@v6
              with:
                  path: tsconfig.tsbuildinfo
                  key: tsc-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'tsconfig.json') }}-${{ github.sha }}
                  restore-keys: tsc-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'tsconfig.json') }}-
            - run: node --run typecheck

    unit:
        name: Unit Tests
        if: github.event.pull_request.draft != true
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v7
            - uses: ./.github/actions/setup
            - run: node --run test

    build:
        name: Build
        if: github.event.pull_request.draft != true
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v7
            - uses: ./.github/actions/setup
            - uses: actions/cache@v6
              with:
                  path: .next/cache
                  key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('next.config.ts', 'src/**/*.[jt]s', 'src/**/*.[jt]sx', 'src/**/*.css') }}
                  restore-keys: |
                      nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
                      nextjs-${{ runner.os }}-
            - run: node --run build
